[project]
name = "agentforge"
version = "0.1.0"
description = "Local-first AI agent factory backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg2-binary>=2.9,<3",
  "httpx>=0.27,<1",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
